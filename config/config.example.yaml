# asset-insights-ddi-demo - example configuration
# Copy to config/config.yaml and edit. config/config.yaml is git-ignored.
#
# FOR CONTROLLED DEMO / TEST ENVIRONMENTS ONLY.
# Items marked TODO(verify) are not confirmed in internal documentation; see docs/verified-sources.md.

# ---------------------------------------------------------------------------
# 1. Where assets come from: Infoblox Universal Asset Insights (public API)
#    POST <base_url>/api/v1/assets/search   (assets already discovered in your tenant)
# ---------------------------------------------------------------------------
asset_source:
  base_url: https://CHANGE-ME.your-tenant.example      # your Infoblox tenant URL
  api_key_env: INFOBLOX_API_KEY     # NAME of the env var holding the API key; never put the key here
  auth_scheme: token                # "token" = API key (Service Graph Connector guides);
                                    # use "Bearer" only if your tenant requires a JWT
  # Narrow to the assets you want to drive traffic for (all optional):
  # filter: 'vendor = "Dell"'       # FilterEL expression
  # providers: [Tenable]            # keep only assets seen by these providers (names as shown in
                                    # Asset Insights, case-insensitive; applied client-side)
  # category: devices               # devices | network | services | unverified
  # fields: [id, name, ip_addresses, mac_addresses, type, vendor]   # default: all fields
  sync_mode: FULL                   # FULL snapshot (or remove the line to omit)
  page_size: 100                    # API max 1000
  max_assets: 500                   # stop early; set 0 to fetch the WHOLE inventory
  verify_tls: true
  ip_selection:                     # which of an asset's addresses may be used for traffic
    private_only: true              # false = also use public addresses (needed for cloud assets'
                                    # public IPs)
    include_cidrs: []               # if set, ONLY these ranges, e.g. [10.20.30.0/24]
    exclude_cidrs: []

store:
  type: json                      # json | sqlite
  path: state/assets.json

# ---------------------------------------------------------------------------
# 2. DNS / DHCP infrastructure (XaaS preferred > OVA > bare metal)
# ---------------------------------------------------------------------------
infrastructure:
  type: xaas                      # xaas | ova | baremetal | mock
  xaas:
    service_name: demo-xaas-service      # informational
    location: demo-location              # informational
    capabilities: [dns, dhcp, dfp]       # what you enabled on the universal service
    # cloud_service_ip: 10.0.0.53        # informational; warns if it differs from dns.server
  ova:
    host_name: demo-niosx-ova
    services: [dns, dhcp, dfp]
  baremetal:
    host_name: demo-niosx-bm
    services: [dns, dhcp, dfp]

dns:
  server: 10.0.0.53
  port: 53
  query_types: [A, AAAA, PTR, TXT]
  qtype_weights: {A: 60, AAAA: 25, PTR: 10, TXT: 5}
  rate_per_asset: 1.0             # queries/second per asset
  duration: 30                    # seconds per run
  concurrency: 10
  timeout: 2.0
  # direct: queries leave from this host (portal attributes them to this host's IP)
  # bind  : bind to each asset IP (host must own those addresses, e.g. lab IP aliases)
  source_mode: spoof
  bind_fallback: direct           # direct | skip, when an asset IP cannot be bound
  # Auto-generated by `demo td fetch` / `demo prepare`. Relative paths are resolved
  # against this config file, so no customer-maintained domains.json is required.
  domains_file: ../state/tide_domains.json
  normal_domains:
    - www.example.com
    - api.example.com

dhcp:
  provider: native                # built-in relay-style DHCP; no DRAS dependency
  server: 172.31.37.228            # CHANGE-ME: NIOS-X DHCP server IP
  port: 67
  delay_between: 0.5
  dra:
    # Historical section name retained for config compatibility. The native provider uses
    # relay_agent_ip as BOOTP giaddr and does not require a DRAS executable.
    use_sudo: false               # ignored by native provider
    relay_agent_ip: 172.31.42.106  # CHANGE-ME: local VM/relay address; giaddr selects the subnet
    relay_map: []                 # per-subnet override: [{cidr: 10.20.40.0/24, relay: 10.20.40.1}]
    # interface: eth0             # -I, only for drasraw
    lease_dir: state/dhcp
    send_hostname: true           # option 12 via -O 12:<hex>
    timeout: 30
    verbose: true

# ---------------------------------------------------------------------------
# 3. Threat Defense demo (DNS only). NO domains are shipped with this project.
# ---------------------------------------------------------------------------
threat_defense:
  # Add domains explicitly approved for YOUR Threat Defense demo tenant.
  # Entry forms:  "name"   or   {name, category, expected_action, note}
  # `category` selects which scenario uses it (blocked | suspicious | default | any label you like).
  # `expected_action` is only a presenter label shown in the checklist; it is not verified.
  domains: []
  #  - {name: replace-me-blocked-1.example, category: blocked, expected_action: block}
  #  - {name: replace-me-suspicious-1.example, category: suspicious, expected_action: log}
  # OR pull ACTIVE threat domains from the portal's TIDE (needs the Active Indicators entitlement).
  # `enabled` only decides whether scenarios USE the stored snapshot; `demo td fetch` works either way.
  # `demo prepare` fetches this snapshot automatically. `demo td fetch` remains available
  # for refresh/inspection. enabled=true means Threat Defense scenarios consume the snapshot.
  # Queries go only to your demo resolver (dns.server); whether the policy blocks a given domain
  # depends on the feeds your policy enables. Check Security Activity in the portal.
  tide:
    enabled: true
    # base_url: https://CHANGE-ME.your-tenant.example   # default: asset_source.base_url
    limit: 100                       # 1..1000
    # classes: [APT, Bot]            # optional TIDE class filter
    # properties: [Phishing_Generic] # optional TIDE property filter
    # profile: IID                   # optional data profile
    category: blocked                # which scenario set these join (blocked | suspicious | ...)
  # A scenario runs ONLY if listed here (explicit approval for the demo tenant):
  enabled_scenarios: [normal-dns, blocked-domain, suspicious-domain, high-volume-dns, mixed-workload]
  scenarios: {}
  # Optional per-scenario overrides, e.g.:
  # scenarios:
  #   mixed-workload: {threat_ratio: 0.1}
  #   high-volume-dns: {rate_multiplier: 3, duration: 60}

# ---------------------------------------------------------------------------
# 4. Safety rails and output
# ---------------------------------------------------------------------------
# 5. Test zones: make the DNS server authoritative for internal names
#    (`demo zones apply | verify | test | status | destroy`)
# ---------------------------------------------------------------------------
# Creates zones/records in Universal DDI through the DNS config API, checks the server answers
# for them authoritatively (AA flag), and queries them as discovered devices. Everything created
# is tagged ManagedBy=asset-insights-ddi-demo and only tagged objects are ever deleted.
# The API key needs a DNS role (DDI DNS Operator or Manager).
zones:
  enabled: false                 # true = run-demo also creates/verifies the zones and queries them
  # No host id is normally needed: dns.server above is matched automatically to dns/host/<id>.
  # dns_host: dns/host/CHANGE-ME # optional explicit override if the IP matches multiple hosts
  # nsg: demo-nsg                # alternative to a host: assign a name server group
  # view: lab                    # DNS view NAME; omit for the tenant's default view
  # allowed_suffixes: [".internal.", ".test.", ".example.", ".invalid.", ".localhost.", ".home.arpa."]
  query_devices: 5               # devices used for the internal-domain queries in run-demo
  wait_seconds: 90               # how long `verify` waits for the server to start answering
  negative_names: [does-not-exist]   # names that must come back NXDOMAIN (authoritative)
  zones:
    - fqdn: demo.internal.       # must end in an allowed suffix (never a real domain)
      comment: asset-insights-ddi-demo test zone
      records:
        # A and MX rdata shapes are verified against internal Infoblox QA docs.
        - {name: host1, type: A, rdata: {address: 10.99.0.10}, ttl: 300}
        - {name: host2, type: A, rdata: {address: 10.99.0.11}, ttl: 300}
        - {name: mail-test, type: MX, rdata: {preference: 10, exchange: mail.demo.internal.}}
        # Other types follow the same pattern but their rdata shapes are NOT verified here:
        # check <tenant>/apidoc (dns/record) and uncomment. The API's error text is shown verbatim.
        # - {name: www, type: CNAME, rdata: {cname: host1.demo.internal.}}
        # - {name: info, type: TXT, rdata: {text: "demo test record"}}
        # - {name: _sip._tcp, type: SRV, rdata: {priority: 10, weight: 5, port: 5060, target: host1.demo.internal.}}

# ---------------------------------------------------------------------------
# 6. DHCP network for the lease demo (`demo ipam apply | status | leases | destroy`)
# ---------------------------------------------------------------------------
# Creates an IP space, a subnet and a range in Universal DDI and assigns your NIOS-X DHCP host to
# serve the subnet, so `demo dhcp request` has somewhere to get a lease from. Tagged and removable.
# Rules from the docs: a DHCP host serves ONE IP space (fixed by its first subnet), and NIOS-federated
# IP spaces ignore dhcp_host. The API key needs DHCP/IPAM write access.
ipam:
  enabled: false                 # true = run-demo creates this network before the DHCP step
  # No host id is normally needed: dhcp.server above is matched automatically to dhcp/host/<id>.
  # dhcp_host: dhcp/host/CHANGE-ME   # optional explicit override if the IP matches multiple hosts
  ip_space: asset-insights-ddi-demo  # IP space NAME
  create_ip_space: true          # false = use an EXISTING space (required if the host already serves one)
  wait_seconds: 60               # the DHCP config takes about a minute to reach the host
  subnets:
    - address: 172.31.32.0       # a subnet that contains your relay address (giaddr, below)
      cidr: 20
      name: demo-vpc-subnet
      ranges:                    # pick addresses NOTHING else in the VPC uses (check the ENIs first)
        - {start: 172.31.47.100, end: 172.31.47.120, name: demo-range}

# Native DHCP lease generation uses the relay address below as BOOTP giaddr.
# giaddr selects the subnet and the server sends the OFFER back to it, so it must be an address the
# VM owns and the DHCP host can reach: the VM's own VPC address works.
# dhcp:
#   server: 172.31.37.228        # the NIOS-X DHCP address
#   dra:
#     relay_agent_ip: 172.31.42.106

# ---------------------------------------------------------------------------
safety:
  allowed_dns_servers: [10.0.0.53]   # empty list disables the allow-list check
  allow_public_dns_server: false     # refuse public resolver addresses unless explicitly allowed
  max_total_qps: 200
  max_duration: 900
  max_assets_per_run: 500

reporting:
  output_dir: reports
  state_dir: state
  verification_buffer_minutes: 5

logging:
  level: INFO
